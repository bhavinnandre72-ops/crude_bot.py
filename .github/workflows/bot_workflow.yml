name: Community Options Bot Workflow

on:
  schedule:
    # सकाळी ९:३० वाजता (IST) - (UTC वेळेनुसार सकाळी ४:०० वाजता)
    - cron: '0 4 * * 1-5'
    
    # दुपारी ४:०० वाजता (IST) - (UTC वेळेनुसार सकाळी १०:३० वाजता)
    - cron: '30 10 * * 1-5'
    
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy requests smartapi-python pyotp logzero websocket-client

    - name: Run Trading Bot
      run: |
        python Community_bot.py
        
